name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  whatsapp-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the unit tests use only Node built-ins and the bot's own modules (no Baileys needed)
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t govi-isuru-api .
      - name: smoke test
        run: |
          docker run -d --name api -p 5000:5000 -e JWT_SECRET=ci-secret-0123456789 \
            -e REFRESH_TOKEN_SECRET=ci-refresh-0123456789 govi-isuru-api
          for i in $(seq 1 20); do curl -s localhost:5000/health && break; sleep 1; done
          docker logs api
          curl -s -o /dev/null -w "%{http_code}\n" localhost:5000/api/ai/status | grep -q 200
